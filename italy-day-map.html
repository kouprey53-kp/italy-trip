<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italy Day Map</title>

<!-- Leaflet MUST be in <head> with no defer/async so L is ready before any script runs -->

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C9A96E;--blue:#7BA8C9;--red:#C0604A;--green:#4EC9B0;}
body{background:#111;color:#fff;font-family:'DM Sans',sans-serif;font-weight:300;
  max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

.topbar{display:flex;align-items:center;padding:0 10px;height:50px;
  background:#111;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;gap:6px;}
.back{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  color:rgba(255,255,255,0.4);text-decoration:none;white-space:nowrap;padding:6px 4px;}
.nav-btn{background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);
  width:28px;height:28px;border-radius:6px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.nav-btn:disabled{opacity:0.2;cursor:default;}
.nav-btn:not(:disabled):hover{border-color:var(--gold);color:var(--gold);}
.topbar-center{flex:1;text-align:center;min-width:0;overflow:hidden;}
#topLabel{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);opacity:0.8;}
#topTitle{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:300;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.day-counter{font-size:10px;color:rgba(255,255,255,0.3);white-space:nowrap;flex-shrink:0;}

#map{flex:1;min-height:0;z-index:1;}

.sheet{flex-shrink:0;background:#161412;border-top:1px solid rgba(255,255,255,0.08);
  overflow-y:auto;scrollbar-width:none;max-height:44vh;}
.sheet::-webkit-scrollbar{display:none;}
.handle{width:34px;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;margin:9px auto 0;}

.route-row{display:flex;align-items:center;padding:10px 14px 6px;gap:0;}
.route-pt{flex:1;}
.route-pt .lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.35;}
.route-pt .city{font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.1;}
.route-pt.right{text-align:right;}
.arrow{color:var(--blue);padding:0 8px;opacity:0.6;font-size:14px;}
.meta-row{display:flex;gap:10px;padding:0 14px 9px;border-bottom:1px solid rgba(255,255,255,0.06);}
.meta-item{font-size:11px;color:rgba(255,255,255,0.35);display:flex;align-items:center;gap:4px;}
.meta-item b{color:rgba(255,255,255,0.7);font-weight:400;}

.gmap-btn{display:flex;align-items:center;gap:6px;margin:8px 14px 0;
  padding:7px 12px;border-radius:7px;border:1px solid rgba(201,169,110,0.25);
  background:rgba(201,169,110,0.06);color:var(--gold);font-size:11px;
  text-decoration:none;letter-spacing:0.04em;}
.gmap-btn:hover{background:rgba(201,169,110,0.12);}

.stops{padding:6px 0 14px;}
.stop{display:flex;gap:10px;padding:8px 14px;align-items:flex-start;}
.stop-line{display:flex;flex-direction:column;align-items:center;padding-top:3px;flex-shrink:0;}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid;flex-shrink:0;}
.dot.start{background:var(--green);border-color:var(--green);}
.dot.via{background:transparent;border-color:var(--gold);}
.dot.end{background:var(--red);border-color:var(--red);}
.connector{width:1px;flex:1;min-height:18px;background:rgba(255,255,255,0.08);margin:2px 0;}
.stop-info{flex:1;min-width:0;}
.stop-name{font-size:13px;color:rgba(255,255,255,0.85);line-height:1.3;}
.stop-name strong{font-weight:500;}
.stop-sub{font-size:10.5px;color:rgba(255,255,255,0.32);margin-top:1px;font-style:italic;}
.tag{display:inline-flex;align-items:center;gap:3px;margin-top:3px;
  font-size:9px;letter-spacing:0.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:10px;border:1px solid;}
.tag-drive{border-color:rgba(123,168,201,0.35);color:var(--blue);}
.tag-explore{border-color:rgba(201,169,110,0.35);color:var(--gold);}
.tag-hike{border-color:rgba(78,201,176,0.35);color:var(--green);}
.tag-checkin{border-color:rgba(192,96,74,0.35);color:var(--red);}
.tag-eat{border-color:rgba(232,147,90,0.35);color:#E8935A;}
.tag-arrive{border-color:rgba(123,168,201,0.35);color:var(--blue);}
.stop-time{font-size:10px;color:var(--gold);white-space:nowrap;padding-top:2px;flex-shrink:0;}

/* Leaflet dark theme overrides */
.leaflet-control-attribution{background:rgba(0,0,0,0.5)!important;color:rgba(255,255,255,0.3)!important;font-size:8px!important;}
.leaflet-control-attribution a{color:rgba(255,255,255,0.4)!important;}
.leaflet-bar{border:1px solid rgba(255,255,255,0.1)!important;}
.leaflet-bar a{background:#1a1816!important;color:rgba(255,255,255,0.7)!important;border-bottom:1px solid rgba(255,255,255,0.08)!important;}
.leaflet-bar a:hover{background:#222!important;color:#fff!important;}
.mlabel{background:#1a1816;color:rgba(255,255,255,0.85);font-family:'DM Sans',sans-serif;
  font-size:9px;padding:2px 7px;border-radius:3px;white-space:nowrap;
  border:1px solid rgba(255,255,255,0.1);box-shadow:0 2px 6px rgba(0,0,0,0.5);
  margin-top:3px;display:block;}

.error-msg{padding:20px;text-align:center;color:rgba(255,255,255,0.4);font-size:12px;}
</style>
</head>

        { ll:[45.6306,8.7231],  name:'Milan Malpensa (MXP)',    sub:'คืนรถเช่า · ขึ้นเครื่องกลับบ้าน',          time:'~10:00', tag:'arrive',  dot:'end'   },

  // ─────────────────────────────────────────────
  // MAP INIT
  // ─────────────────────────────────────────────
  var map = L.map('map', { zoomControl: false, attributionControl: true })
              .setView([44, 11], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  var routeLayer  = null;
  var markerGroup = null;

  // ─────────────────────────────────────────────
  // CURRENT DAY from URL param
  // ─────────────────────────────────────────────
  var cur = parseInt(new URLSearchParams(location.search).get('d') || '0');
  cur = Math.max(0, Math.min(DAYS.length - 1, isNaN(cur) ? 0 : cur));

  // ─────────────────────────────────────────────
  // RENDER A DAY
  // ─────────────────────────────────────────────
  function render(idx) {
    cur = idx;
    history.replaceState(null, '', '?d=' + idx);

    var day = DAYS[idx];

    document.getElementById('topLabel').textContent   = day.label;
    document.getElementById('topTitle').textContent   = day.title;
    document.getElementById('dayCounter').textContent = (idx + 1) + ' / ' + DAYS.length;
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').disabled = idx === DAYS.length - 1;

    // Clear old layers
    if (routeLayer)  { map.removeLayer(routeLayer);  routeLayer  = null; }
    if (markerGroup) { map.removeLayer(markerGroup); markerGroup = null; }
    markerGroup = L.layerGroup().addTo(map);

    // Add markers
    var dotColors = { start: '#4EC9B0', via: '#C9A96E', end: '#C0604A' };
    day.stops.forEach(function(s) {
      var c  = dotColors[s.dot] || '#C9A96E';
      var sz = s.dot === 'via' ? 8 : 11;
      var icon = L.divIcon({
        className: '',
        html: '<div style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;' +
              'background:' + c + ';border:2px solid #111;' +
              'box-shadow:0 0 0 2px ' + c + '44;"></div>' +
              '<span class="mlabel" style="border-color:' + c + '33;' +
              'opacity:' + (s.dot === 'via' ? 0.75 : 1) + ';">' +
              s.name.split('·')[0].trim() + '</span>',
        iconAnchor: [0, 0],
        iconSize: [130, 44]
      });
      L.marker(s.ll, { icon: icon }).addTo(markerGroup);
    });

    renderSheet(day);

    if (day.type === 'drive') {
      drawOSRM(day);
    } else {
      var lls = day.stops.map(function(s) { return s.ll; });
      routeLayer = L.polyline(lls, {
        color: day.accent || '#C9A96E', weight: 2, opacity: 0.55, dashArray: '5,9'
      }).addTo(map);
      map.fitBounds(L.latLngBounds(lls), { padding: [55, 55] });
    }
  }

  // ─────────────────────────────────────────────
  // OSRM ROUTING
  // ─────────────────────────────────────────────
  function drawOSRM(day) {
    var coords = day.stops.map(function(s) { return s.ll[1] + ',' + s.ll[0]; }).join(';');
    fetch('https://router.project-osrm.org/route/v1/driving/' + coords +
          '?overview=full&geometries=geojson')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var route = data.routes[0];
        routeLayer = L.geoJSON(route.geometry, {
          style: { color: '#7BA8C9', weight: 3.5, opacity: 0.85, lineCap: 'round' }
        }).addTo(map);
        var pts = route.geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
        map.fitBounds(L.latLngBounds(pts), { padding: [55, 55] });
        var km = (route.distance / 1000).toFixed(0);
        var h  = Math.floor(route.duration / 3600);
        var m  = Math.floor((route.duration % 3600) / 60);
        var dEl = document.getElementById('distVal');
        var tEl = document.getElementById('durVal');
        if (dEl) dEl.textContent = km + ' km';
        if (tEl) tEl.textContent = h + 'h ' + m + 'min';
      })
      .catch(function() {
        // Fallback: dashed straight polyline
        var lls = day.stops.map(function(s) { return s.ll; });
        routeLayer = L.polyline(lls, { color: '#7BA8C9', weight: 3, opacity: 0.6, dashArray: '6,7' }).addTo(map);
        map.fitBounds(L.latLngBounds(lls), { padding: [55, 55] });
      });
  }

  // ─────────────────────────────────────────────
  // RENDER BOTTOM SHEET
  // ─────────────────────────────────────────────
  function renderSheet(day) {
    var tagClass = {
      drive:'tag-drive', explore:'tag-explore', hike:'tag-hike',
      checkin:'tag-checkin', eat:'tag-eat', arrive:'tag-arrive'
    };
    var tagLabel = {
      drive:'🚗 ขับรถ', explore:'👁 เที่ยว', hike:'🥾 เดินป่า',
      checkin:'🏨 เช็คอิน', eat:'🍽 กิน', arrive:'✈️ เดินทาง'
    };

    var gmapPts = day.stops.map(function(s) { return s.ll[0] + ',' + s.ll[1]; }).join('/');
    var gmapUrl = 'https://www.google.com/maps/dir/' + gmapPts;

    var routeHtml = '';
    if (day.type === 'drive') {
      routeHtml =
        '<div class="route-row">' +
          '<div class="route-pt"><div class="lbl">จาก</div><div class="city">' + (day.from||'') + '</div></div>' +
          '<div class="arrow">→</div>' +
          '<div class="route-pt right"><div class="lbl">ถึง</div><div class="city">' + (day.to||'') + '</div></div>' +
        '</div>' +
        '<div class="meta-row">' +
          '<div class="meta-item">🚗 <b id="distVal">กำลังคำนวณ...</b></div>' +
          '<div class="meta-item">⏱ <b id="durVal">—</b></div>' +
        '</div>';
    }

    var stopsHtml = day.stops.map(function(s, i) {
      var isLast = i === day.stops.length - 1;
      return '<div class="stop">' +
        '<div class="stop-line">' +
          '<div class="dot ' + s.dot + '"></div>' +
          (!isLast ? '<div class="connector"></div>' : '') +
        '</div>' +
        '<div class="stop-info">' +
          '<div class="stop-name"><strong>' + s.name + '</strong></div>' +
          '<div class="stop-sub">' + s.sub + '</div>' +
          '<span class="tag ' + (tagClass[s.tag]||'tag-explore') + '">' + (tagLabel[s.tag]||s.tag) + '</span>' +
        '</div>' +
        '<div class="stop-time">' + s.time + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('sheetContent').innerHTML =
      routeHtml +
      '<a class="gmap-btn" href="' + gmapUrl + '" target="_blank">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
          '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>' +
          '<circle cx="12" cy="9" r="2.5"/>' +
        '</svg>' +
        'เปิดใน Google Maps' +
      '</a>' +
      '<div class="stops">' + stopsHtml + '</div>';
  }

  // ─────────────────────────────────────────────
  // NAVIGATION
  // ─────────────────────────────────────────────
  document.getElementById('prevBtn').addEventListener('click', function() {
    if (cur > 0) render(cur - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', function() {
    if (cur < DAYS.length - 1) render(cur + 1);
  });

  // Keyboard arrow support
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft'  && cur > 0)              render(cur - 1);
    if (e.key === 'ArrowRight' && cur < DAYS.length - 1) render(cur + 1);
  });

  // Initial render
  render(cur);

}); // end DOMContentLoaded
</script>
